<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Snake Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Pretendard, sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .score-box {
            font-size: 24px;
            margin-bottom: 15px;
        }

        canvas {
            background: #1b1b1b;
            border: 4px solid #333;
            border-radius: 20px;
        }

        .help {
            margin-top: 15px;
            text-align: center;
            opacity: 0.8;
        }

        .help p {
            margin: 5px;
        }

        @media (max-width: 500px) {
            canvas {
                width: 95vw;
                height: 95vw;
            }
        }
    </style>
</head>
<body>

    <h1>🐍 Snake Game</h1>

    <div class="score-box">
        점수 :
        <span id="score">0</span>
    </div>

    <canvas
        id="gameCanvas"
        width="400"
        height="400"
    ></canvas>

    <div class="help">
        <p>← ↑ → ↓ 또는 WASD</p>
        <p>게임 오버 시 R 키로 재시작</p>
    </div>

    <script src="snake.js"></script>

</body>
</html>
