<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <style>
        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#f5f5f5;
            font-family:sans-serif;
        }

        .box{
            width:320px;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,.1);

            display:flex;
            flex-direction:column;
            gap:12px;
        }

        input,button{
            padding:12px;
            font-size:16px;
        }

        #msg{
            min-height:20px;
            text-align:center;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>로그인</h1>

    <input
        type="text"
        id="username"
        placeholder="아이디"
        maxlength="20"
    >

    <input
        type="password"
        id="password"
        placeholder="비밀번호"
        maxlength="30"
    >

    <button id="loginBtn">로그인</button>
    <button id="registerBtn">회원가입</button>

    <div id="msg"></div>
</div>

<script type="module" src="login.js"></script>

</body>
</html>
