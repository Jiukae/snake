<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square.css" rel="stylesheet">
    <title>홈 페이지</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        body {
            margin: 0;
            display: flex;
            height: 100vh;
            font-family: 'NanumSquare', sans-serif;
        }

                /* 왼쪽 사이드바 */
        header {
            width: 100%;                  /* 전체 가로 폭 */
            height: 70px;                 /* 헤더 높이 */
            background-color: #f0f4ff;    /* 배경색 */
            display: flex;
            justify-content: space-between; /* 좌우 배치 */
            align-items: center;            /* 세로 중앙 정렬 */
            padding: 0 20px;               /* 좌우 여백 */
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); /* 아래 그림자 */
            position: fixed;               /* 화면 상단 고정 */
            top: 0;
            left: 0;
            z-index: 1000;                 /* 다른 요소보다 위에 표시 */
            background: linear-gradient(
                to right,
                #c3e8f8 0%,     /* 로고 배경색 시작 */
                #c3e8f8 30%,    /* 로고 끝지점까지 유지 */
                #f0f4ff 100%    /* 헤더 기본색으로 자연스럽게 이어짐 */
            );
        }
        .left-group, .right-group {
            display: flex;
            align-items: center;
            gap: 10px; /* 아이콘 간격 */
        }

        .right-group {
            gap: 15px; /* 오른쪽 아이콘 간격 */
            margin-right: 30px; /* 오른쪽 끝에서 떨어지게 */
        }

        header button img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }
        header button {
            background-color: transparent;
            border: none;
            cursor: pointer;
            margin: 15px 0;
            width: 100%;
            transition: filter 0.3s ease;
        }
        header button img {
            max-width: 40px;
            max-height: 40px;
            transition: filter 0.3s ease;
        }
        header button:hover img {
            filter: brightness(1.2);
        }
        .logo
        {
            width: 280px;
            height: auto;
        }
        /* 오른쪽 메인 영역 */
        .main {
            flex: 1;
            display: flex;
            justify-content: center; /* 가로 중앙 */
            align-items: center;     /* 세로 중앙 */
            flex-direction: column;
        }
        .main h1 {
            color: #00ccff;
            margin-bottom: 30px;
            font-family: 'NanumSquareAceb', sans-serif;
        }
        .main button {
            background-color: #0059ff;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.3s ease;
            font-family: 'NanumSquareAcb', sans-serif;
        }
        .main button:hover {
            background-color: #000da0;
        }

    </style>
</head>
<body>
    <header>
    <div class="left-group">
        <img class="logo" src="thelogo.png" alt="로고">
        <a href="more.html"><button><img src="more-icon.png" alt="더보기"></button></a>
    </div>

    <div class="right-group">
        <a href="ranking.html"><button><img src="ranking-icon.png" alt="랭킹"></button></a>
        <a href="shop.html"><button><img src="shop-icon.png" alt="상점"></button></a>
        <button class="mode"><img src="mode-icon.png" alt="모드"></button>
    </div>
    </header>


    <!-- 오른쪽 메인 영역 -->
    <div class="main">
        <h1>SNAKE GAME</h1>
        <a href="snake.html"><button>플레이</button></a>
    </div>
</body>
</html>
